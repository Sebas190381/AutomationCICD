name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Selenium Grid (standalone)
        run: |
          SELENIUM_VERSION=4.35.0
          curl -sL -o /tmp/selenium-server.jar \
            "https://github.com/SeleniumHQ/selenium/releases/download/selenium-${SELENIUM_VERSION}/selenium-server-${SELENIUM_VERSION}.jar"
          nohup java -jar /tmp/selenium-server.jar standalone --port 4444 > /tmp/grid.log 2>&1 &
          # Wait for the Grid to report ready
          for i in $(seq 1 30); do
            if curl -s --max-time 2 http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid is ready"
              break
            fi
            sleep 2
          done

      - name: Run Grid suite (Chrome via Grid)
        run: mvn test -Dsurefire.suiteXmlFiles=testSuites/Grid.xml -Dbrowser=grid -DbrowserName=chrome

      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: reports/

      - name: Upload Grid log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grid-log
          path: /tmp/grid.log
