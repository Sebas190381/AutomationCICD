# SLF4J Simple Logger configuration
# Fix Warning 2: sets default log level to WARN so INFO noise is suppressed
org.slf4j.simpleLogger.defaultLogLevel=warn

# Fix Warning 1: suppress the CDP version mismatch warning from Selenium
# These two loggers emit the "Unable to find CDP implementation" warning
org.slf4j.simpleLogger.log.org.openqa.selenium.devtools=error
org.slf4j.simpleLogger.log.org.openqa.selenium.chromium=error

# Keep test output clean — suppress WebDriverManager download info logs
org.slf4j.simpleLogger.log.io.github.bonigarcia=warn

# Show timestamps in log output for easier debugging
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
